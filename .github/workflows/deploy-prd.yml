name: Deploy prd

# Manual-only: a prod deploy happens only when someone runs this workflow
# (Actions -> Deploy prd -> Run workflow), never on push. The `prd`
# environment only accepts runs from main (infra/bootstrap.ps1 sets that).
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-prd
  cancel-in-progress: false

env:
  AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}

jobs:
  prd-infra:
    runs-on: ubuntu-latest
    environment: prd
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
    outputs:
      swaName: ${{ steps.deploy.outputs.swaName }}
    steps:
      - uses: actions/checkout@v7
      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy Bicep
        id: deploy
        run: |
          az deployment group create \
            --resource-group pk-www-prd \
            --template-file infra/main.bicep \
            --parameters infra/prd.bicepparam \
            --name prd-${{ github.run_id }}
          swaName=$(az deployment group show \
            --resource-group pk-www-prd \
            --name prd-${{ github.run_id }} \
            --query properties.outputs.swaName.value -o tsv)
          echo "swaName=${swaName}" >> "$GITHUB_OUTPUT"
          customHostname=$(az deployment group show \
            --resource-group pk-www-prd \
            --name prd-${{ github.run_id }} \
            --query properties.outputs.customHostname.value -o tsv)
          echo "customHostname=${customHostname}" >> "$GITHUB_OUTPUT"
          apexHostname=$(az deployment group show \
            --resource-group pk-www-prd \
            --name prd-${{ github.run_id }} \
            --query properties.outputs.apexHostname.value -o tsv)
          echo "apexHostname=${apexHostname}" >> "$GITHUB_OUTPUT"

      - name: Register custom domain (non-blocking)
        if: steps.deploy.outputs.customHostname != ''
        env:
          SWA: ${{ steps.deploy.outputs.swaName }}
          HOST: ${{ steps.deploy.outputs.customHostname }}
        run: |
          # See deploy-stg.yml: registered async so validation never blocks
          # (and outlives) the OIDC-authed deploy. Registered once only: doing
          # it again would unset www as the default domain (the step below).
          status=$(az staticwebapp hostname show --name "$SWA" --resource-group pk-www-prd \
            --hostname "$HOST" --query status -o tsv 2>/dev/null || true)
          if [ -z "$status" ]; then
            az staticwebapp hostname set --name "$SWA" --resource-group pk-www-prd \
              --hostname "$HOST" --validation-method cname-delegation --no-wait || true
          fi
          echo "$HOST: ${status:-registered}"

      - name: Register apex domain (non-blocking)
        if: steps.deploy.outputs.apexHostname != ''
        env:
          SWA: ${{ steps.deploy.outputs.swaName }}
          APEX: ${{ steps.deploy.outputs.apexHostname }}
        run: |
          # An apex cannot be a CNAME, so it proves ownership with a TXT token
          # at `@` instead (Bicep has already pointed its alias A record at the
          # SWA). Registered once: a Ready or validating domain is left alone.
          status=$(az staticwebapp hostname show --name "$SWA" --resource-group pk-www-prd \
            --hostname "$APEX" --query status -o tsv 2>/dev/null || true)
          if [ -z "$status" ]; then
            az staticwebapp hostname set --name "$SWA" --resource-group pk-www-prd \
              --hostname "$APEX" --validation-method dns-txt-token --no-wait || true
          fi
          # Publish the token in the zone if it is not there yet. SWA issues it
          # a few seconds after registration. A new token (a Static Web App
          # made again) must also be copied into infra/zone.bicep's apexTxt,
          # or the next zone deploy removes it.
          token=''
          for i in $(seq 1 24); do
            token=$(az staticwebapp hostname show --name "$SWA" --resource-group pk-www-prd \
              --hostname "$APEX" --query validationToken -o tsv 2>/dev/null || true)
            [ -n "$token" ] && break
            [ "$status" = "Ready" ] && break
            sleep 5
          done
          if [ -n "$token" ]; then
            have=$(az network dns record-set txt show --resource-group global --zone-name "$APEX" \
              --name @ --query "TXTRecords[].value[]" -o tsv 2>/dev/null || true)
            if ! grep -qx "$token" <<< "$have"; then
              az network dns record-set txt add-record --resource-group global --zone-name "$APEX" \
                --record-set-name @ --value "$token" --output none
            fi
          fi
          echo "$APEX: ${status:-registered}"

      - name: Make www the default domain
        if: steps.deploy.outputs.customHostname != ''
        env:
          SWA: ${{ steps.deploy.outputs.swaName }}
          HOST: ${{ steps.deploy.outputs.customHostname }}
        run: |
          # The portal's "Set default": SWA then 301s every other hostname (the
          # apex, the azurestaticapps.net address) to www. az has no command for
          # it, so it goes through the REST API. Azure takes it only once www is
          # Ready; before that the next deploy does it.
          url="https://management.azure.com/subscriptions/${AZURE_SUBSCRIPTION_ID}/resourceGroups/pk-www-prd/providers/Microsoft.Web/staticSites/${SWA}/customDomains/${HOST}?api-version=2024-04-01"
          read -r status isDefault < <(az rest --method get --url "$url" \
            --query "[properties.status, properties.isDefault]" -o tsv 2>/dev/null | paste -sd' ') || true
          if [ "$status" = "Ready" ] && [ "$isDefault" != "true" ]; then
            az rest --method put --url "$url" --output none \
              --body '{"properties":{"validationMethod":"cname-delegation","isDefault":true}}' || true
            isDefault=true
          fi
          echo "$HOST: ${status:-not registered}, default=${isDefault:-false}"

  prd-app:
    needs: prd-infra
    runs-on: ubuntu-latest
    environment: prd
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v7
      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
      - name: Fetch SWA deployment token
        id: token
        run: |
          token=$(az staticwebapp secrets list \
            --name ${{ needs.prd-infra.outputs.swaName }} \
            --resource-group pk-www-prd \
            --query properties.apiKey -o tsv)
          echo "::add-mask::${token}"
          echo "token=${token}" >> "$GITHUB_OUTPUT"
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - name: Build site
        run: |
          npm ci
          npm run build
      - name: Deploy SWA content
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.token.outputs.token }}
          action: upload
          app_location: dist
          api_location: api
          skip_app_build: true
